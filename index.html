/* One dark look on purpose: a terminal. Colors are tokens, change them here. */
:root{
  --bg:#090b10;
  --panel:#0e1117;
  --bar:#141923;
  --line:#232b3a;
  --text:#d6dbe7;
  --dim:#6a7387;
  --green:#7ee8a2;     /* user, success */
  --cyan:#5ccfff;      /* folders, host */
  --violet:#b39cff;    /* headings, path */
  --pink:#ff7eb6;
  --amber:#ffc56e;     /* notices, flags */
  --red:#ff6b7a;       /* errors */
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(60% 50% at 15% 0%,rgba(92,207,255,.10),transparent 60%),
    radial-gradient(50% 50% at 95% 10%,rgba(179,156,255,.10),transparent 60%),
    radial-gradient(60% 60% at 50% 110%,rgba(126,232,162,.08),transparent 60%),
    var(--bg);
  color:var(--text);font-family:var(--mono);
}
.stage{
  height:100%;display:flex;justify-content:center;
  padding-block:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.term{
  width:min(100%,1000px);height:100%;min-height:0;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 90px -40px rgba(126,232,162,.35),0 0 0 1px rgba(255,255,255,.02) inset;
}
.bar{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--bar);border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}
.dots{display:flex;gap:7px;flex:none}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
#title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.screen{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 10px;font-size:14px;line-height:1.6;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.l{white-space:pre-wrap;word-break:break-word;min-height:1.6em}
.screen a{color:var(--cyan);text-underline-offset:3px}
.row{display:flex;align-items:baseline;gap:0}
.prompt{white-space:pre;flex:none}
#in{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;margin:0 0 0 8px;color:var(--text);font:inherit;caret-color:var(--green)}

.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.chips button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;transition:border-color .2s,color .2s}
.chips button:hover{border-color:var(--green);color:var(--green)}
.chips button:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* text colors used by the terminal */
.g{color:var(--green)}.c{color:var(--cyan)}.v{color:var(--violet)}.p{color:var(--pink)}.a{color:var(--amber)}.r{color:var(--red)}.d{color:var(--dim)}
.dir{color:var(--cyan);font-weight:700}
.hid{color:var(--dim)}
.h1{color:var(--violet);font-weight:700}
.h2{color:var(--amber);font-weight:700}
.name{font-weight:700;font-size:1.25em;background:linear-gradient(100deg,var(--cyan),var(--violet) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:560px){.screen{font-size:13px;padding:14px 12px 8px}#in{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

      ['clear', 'clear the screen (or Ctrl+L)'],
    ];
    return { html: '<span class="a">commands</span>\n' + rows.map(r => '  <span class="g">' + esc(r[0].padEnd(30)) + '</span><span class="d">' + esc(r[1]) + '</span>').join('\n') +
      '\n\n<span class="d">Tab completes names. Up and down arrows recall old commands. You can chain with a pipe: cat about.txt | grep UConn</span>' };
  },
  ls(args) {
    const [f, paths] = flagsAndArgs(args);
    const target = paths[0] || '.';
    const node = get(target);
    if (node === undefined) return err("ls: cannot access '" + target + "': No such file or directory");
    if (!isDir(node)) return { html: nameHTML(target, node) };
    let names = sorted(Object.keys(node).filter(n => f.a || !n.startsWith('.')));
    const entries = names.map(n => [n, node[n]]);
    if (f.a) entries.unshift(['.', {}], ['..', {}]);
    if (f.l) {
      const rows = entries.map(([n, v]) => (isDir(v) ? 'drwxr-xr-x' : '-rw-r--r--') + ' 1 ' + user.padEnd(8) + ' ' + String(isDir(v) ? 4096 : v.length).padStart(5) + ' Oct 26 09:00 ' + nameHTML(n, v));
      return { html: '<span class="d">total ' + entries.length + '</span>\n' + rows.join('\n') };
    }
    return { html: entries.map(([n, v]) => nameHTML(n, v)).join('  ') || '' };
  },
  cd(args) {
    const target = args[0] || '~';
    const parts = norm(target), node = walk(parts);
    if (node === undefined) return err('bash: cd: ' + target + ': No such file or directory');
    if (!isDir(node))       return err('bash: cd: ' + target + ': Not a directory');
    cwd = parts; refreshPrompt(); return { text: '' };
  },
  pwd() { return { text: '/home/' + user + (cwd.length ? '/' + cwd.join('/') : '') }; },
  cat(args, stdin) {
    if (!args.length && stdin !== null) return { text: stdin };
    let text = [];
    for (const a of args) { const r = fileArg(a, 'cat'); if (r.e) return r.e; text.push(r.n); }
    return { text: text.join('\n'), md: true };
  },
  head(args, stdin) { return headTail(args, stdin, true); },
  tail(args, stdin) { return headTail(args, stdin, false); },
  tree(args) {
    const [f, paths] = flagsAndArgs(args);
    const node = get(paths[0] || '.');
    if (node === undefined) return err('tree: ' + paths[0] + ': No such file or directory');
    if (!isDir(node)) return { html: nameHTML(paths[0], node) };
    let dirs = 0, files = 0;
    const draw = (n, prefix) => sorted(Object.keys(n).filter(k => f.a || !k.startsWith('.'))).map((k, i, arr) => {
      const last = i === arr.length - 1, v = n[k];
      isDir(v) ? dirs++ : files++;
      return prefix + (last ? '└── ' : '├── ') + nameHTML(k, v) + (isDir(v) ? '\n' + draw(v, prefix + (last ? '    ' : '│   ')) : '');
    }).filter(Boolean).join('\n').replace(/\n+$/, '');
    return { html: '<span class="dir">' + esc(paths[0] || '.') + '</span>\n' + draw(node, '') + '\n\n<span class="d">' + dirs + ' directories, ' + files + ' files</span>' };
  },
  grep(args, stdin) {
    const [f, rest] = flagsAndArgs(args);
    const pat = rest.shift();
    if (!pat) return err('usage: grep [-ri] pattern [file ...]');
    let re; try { re = new RegExp(pat, f.i ? 'i' : ''); } catch (e) { re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), f.i ? 'i' : ''); }
    const hits = [];
    const scan = (label, text, prefix) => text.split('\n').forEach(l => { if (re.test(l)) hits.push((prefix ? label + ':' : '') + l); });
    if (!rest.length && stdin !== null) scan('', stdin, false);
    else {
      const files = [];
      const collect = (n, path) => isDir(n) ? Object.keys(n).sort().forEach(k => collect(n[k], path + '/' + k)) : files.push([path.replace(/^\.\//, ''), n]);
      for (const a of (rest.length ? rest : ['.'])) {
        const n = get(a);
        if (n === undefined) return err('grep: ' + a + ': No such file or directory');
        if (isDir(n) && !f.r) return err('grep: ' + a + ': Is a directory');
        collect(n, a);
      }
      files.forEach(([p, t]) => scan(p, t, files.length > 1 || f.r));
    }
    return { text: hits.join('\n') };
  },
  echo(args) { return { text: args.join(' ').replace(/\$USER/g, user).replace(/\$HOME/g, '/home/' + user) }; },
  history() { return { text: hist.map((h, i) => String(i + 1).padStart(4) + '  ' + h).join('\n') }; },
  whoami() { return { text: user }; },
  hostname() { return { text: 'mason' }; },
  date() { return { text: new Date().toString() }; },
  uname(args) { return { text: args.includes('-a') ? 'Linux mason 6.1.0-portfolio #1 SMP x86_64 GNU/Linux' : 'Linux' }; },
  clear() { out.innerHTML = ''; return { text: '' }; },
  sudo() { return err(user + ' is not in the sudoers file. This incident will be reported.'); },
  rm() { return err('rm: cannot remove: Read-only file system'); },
  exit() {
    if (user === 'admin') { user = 'visitor'; refreshPrompt(); return { text: 'logout' }; }
    return { text: 'logout\nThere is nowhere else to go. Type help.' };
  },

  /* ---- these three are not in help on purpose ---- */
  base64(args, stdin) {
    const [f, rest] = flagsAndArgs(args);
    const data = rest.length ? rest.join(' ') : (stdin || '');
    try {
      return { text: f.d ? decodeURIComponent(escape(atob(data.trim()))) : btoa(unescape(encodeURIComponent(data))) };
    } catch (e) { return err('base64: invalid input'); }
  },
  su(args) {
    if (args[0] !== 'admin') return err(args[0] ? 'su: user ' + args[0] + ' does not exist' : 'su: usage: su <user>');
    if (user === 'admin') return { text: '' };
    pending = {
      label: 'Password:', secret: true,
      done(pw) {
        if (pw !== ADMIN_PASSWORD) return err('su: Authentication failure');
        user = 'admin'; FS.vault = VAULT; return { text: 'Welcome, admin. A new folder appeared: vault/' };
      },
    };
    return { text: '' };
  },
  flags() {
    return { text: 'flags: ' + found.size + '/3' + FLAGS.map((f, i) => '\n[' + (found.has(i) ? 'x' : ' ') + '] ' + (found.has(i) ? f : '???')).join('') };
  },
};
function headTail(args, stdin, head) {
  let n = 10; const files = [];
  for (let i = 0; i < args.length; i++) {
    if (args[i] === '-n') n = parseInt(args[++i], 10) || 10;
    else if (/^-\d+$/.test(args[i])) n = -parseInt(args[i], 10);
    else files.push(args[i]);
  }
  let text = stdin;
  if (files.length) { const r = fileArg(files[0], head ? 'head' : 'tail'); if (r.e) return r.e; text = r.n; }
  if (text === null) return err((head ? 'head' : 'tail') + ': missing file');
  const lines = text.split('\n');
  return { text: (head ? lines.slice(0, n) : lines.slice(-n)).join('\n') };
}

/* ---- running a line (supports pipes: a | b) ---- */
function run(line) {
  let stdin = null, res = { text: '' };
  for (const stage of line.split('|')) {
    const argv = tokenize(stage.trim());
    if (!argv.length) continue;
    const fn = COMMANDS[argv[0]];
    if (!fn) { res = err('bash: ' + argv[0] + ': command not found'); break; }
    res = fn(argv.slice(1), stdin) || { text: '' };
    stdin = res.html !== undefined ? strip(res.html) : res.text;
    if (res.err) break;
  }
  show(res);
}
function show(res) {
  const plain = res.html !== undefined ? strip(res.html) : res.text;
  if (res.html !== undefined) say(res.html);
  else if (res.text !== '' && res.text !== undefined) say(res.text.split('\n').map(res.md ? md : l => link(esc(l))).join('\n'), res.err ? 'r' : '');
  FLAGS.forEach((f, i) => {                               // capture any flag that was just printed
    if (plain.includes(f) && !found.has(i)) {
      found.add(i);
      say('◆ flag captured [' + found.size + '/3]', 'a');
      if (found.size === 3) say('All three found. Nicely done. Now cat contact.txt and say hi.', 'g');
    }
  });
}

/* ---- typing: Enter, history, tab completion ---- */
function submit(raw) {
  if (pending) {                                          // password prompt
    const p = pending; pending = null;
    say('<span class="d">' + esc(p.label) + '</span>');
    refreshPrompt(); show(p.done(raw)); refreshPrompt(); return;
  }
  say('<span class="prompt">' + promptHTML() + '</span> ' + esc(raw));
  const line = raw.trim();
  if (!line) return;
  hist.push(line); hpos = hist.length;
  run(line);
  if (pending) { say('<span class="d">' + esc(pending.label) + '</span>'); refreshPrompt(); }
}
function complete() {
  const m = input.value.match(/^(.*?)(\S*)$/), head = m[1], word = m[2];
  let options;
  if (head.trim() === '') options = Object.keys(COMMANDS).filter(c => c !== 'flags' && c.startsWith(word));
  else {
    const i = word.lastIndexOf('/') + 1, dirPart = word.slice(0, i), base = word.slice(i);
    const node = get(dirPart || '.');
    if (!isDir(node)) return;
    options = Object.keys(node).filter(n => n.startsWith(base) && (base.startsWith('.') || !n.startsWith('.')))
      .map(n => dirPart + n + (isDir(node[n]) ? '/' : ''));
  }
  if (!options.length) return;
  if (options.length === 1) { input.value = head + options[0] + (options[0].endsWith('/') ? '' : ' '); return; }
  let common = options[0];
  options.forEach(o => { while (!o.startsWith(common)) common = common.slice(0, -1); });
  if (common.length > word.length) input.value = head + common;
  else { say('<span class="prompt">' + promptHTML() + '</span> ' + esc(input.value)); say(options.map(o => esc(o)).join('  '), 'd'); }
}
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = input.value; input.value = ''; submit(v); }
  else if (e.key === 'Tab') { e.preventDefault(); if (!pending) complete(); }
  else if (e.key === 'ArrowUp')   { e.preventDefault(); if (hpos > 0) input.value = hist[--hpos]; }
  else if (e.key === 'ArrowDown') { e.preventDefault(); input.value = hpos < hist.length - 1 ? hist[++hpos] : (hpos = hist.length, ''); }
  else if (e.ctrlKey && e.key === 'l') { e.preventDefault(); out.innerHTML = ''; }
  else if (e.ctrlKey && e.key === 'c') {
    e.preventDefault(); say('<span class="prompt">' + promptHTML() + '</span> ' + esc(input.value) + '^C'); input.value = ''; pending = null; refreshPrompt();
  }
});
screen.addEventListener('click', () => { if (!getSelection().toString()) input.focus(); });
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  pending = null; refreshPrompt(); submit(b.dataset.cmd); input.focus();
});

/* ---- start up ---- */
say('<span class="name">Mason Moore</span>');
say('<span class="d">Machine Learning · Security · Systems</span>');
say('<span class="d">Last login: ' + new Date().toDateString() + ' on ttys001</span>');
say('');
say('Welcome. This whole site is a terminal.');
say('  <span class="g">ls</span>              <span class="d">see what is here</span>');
say('  <span class="g">cat about.txt</span>   <span class="d">read a file</span>');
say('  <span class="g">cd projects</span>     <span class="d">go into a folder</span>');
say('  <span class="g">help</span>            <span class="d">every command</span>');
say('');
refreshPrompt();
console.log('%c psst: ls -a ', 'background:#7ee8a2;color:#090b10;font-family:monospace');
if (matchMedia('(hover:hover)').matches) input.focus();
})();
</script>
